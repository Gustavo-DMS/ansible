---
# update: true
# swapfile_path: /swapfile
# swapfile_size: 8G

source_key: "./.ssh/id_rsa"
dest_key: "{{ homedir }}/.ssh/id_rsa"

homedir: "{{ lookup('env','HOME') }}"
srcdir: "{{ homedir }}/.src"

