  - curl
  - dhcpcd
  - netctl
  - networkmanager
  - openssh
  - pipewire
  - man-db
  - man-pages
  - git
  - wget
  - reflector
  - neovim

gpu_packages:
  - nvidia-dkms
  - nvidia-utils
  - egl-wayland

